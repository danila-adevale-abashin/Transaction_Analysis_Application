[project]
name = "transaction-analysis-application"
version = "0.1.0"
description = ""
authors = [
    {name = "Абашин Данила Евгеньевич",email = "daniel.abashin@yandex.ru"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "black (==26.5.1)",
    "flake8 (==7.3.0)",
    "isort (==9.0.1)",
    "mypy (==2.3.1)",
    "pytest (==9.1.1)",
    "pandas (==3.1.0)",
    "requests (==2.34.2)",
    "certifi (==2026.10.23)",
    "charset-normalizer (==3.5.2)",
    "click (==8.5.0)",
    "colorama (==0.4.6)",
    "coverage (==7.16.2)",
    "dotenv (==0.9.9)",
    "et-xmlfile (==2.0.0)",
    "idna (==3.20)",
    "iniconfig (==2.3.0)",
    "mccabe (==0.7.0)",
    "mypy-extensions (==1.1.0)",
    "numpy (==2.5.4)",
    "openpyxl (==3.1.5)",
    "packaging (==26.3)",
    "pathspec (==1.1.1)",
    "platformdirs (==4.11.8)",
    "pluggy (==1.6.0)",
    "pycodestyle (==2.14.0)",
    "pyflakes (==3.4.0)",
    "pygments (==2.21.0)",
    "pytest-cov (==7.1.0)",
    "python-dateutil (==3.0.0)",
    "python-dotenv (==1.2.4)",
    "pytokens (==0.4.1)",
    "six (==1.17.0)",
    "typing-extensions (==4.16.0)",
    "tzdata (==2026.6)",
    "urllib3 (==2.8.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
# Указывает pytest, что тесты лежат в папке tests
testpaths = ["tests"]
# Шаблон имён файлов с тестами
python_files = ["test_*.py"]
# Добавляет флаги, которые применяются ко всем запускам pytest
addopts = [
    "-ra",                        # Показывать краткую сводку по всем тестам
    "--strict-markers",           # Ошибка при использовании неизвестных маркеров
    "--cov=src",                  # Собирать покрытие ТОЛЬКО для папки src
    "--cov-report=term-missing",  # Показывать строки, которые не покрыты тестами
]

[tool.coverage.run]
# Указывает, какие файлы анализировать (только код в src)
source = ["src"]
# Учитывает ветвления if/else в покрытии
branch = true

[tool.coverage.report]
# Исключает из отчёта строки, которые не нужно покрывать тестами
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
python_version = "3.14"
#disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
#mypy_path = 'src'
explicit_package_bases = true